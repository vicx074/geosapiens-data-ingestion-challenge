name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar a JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar e testar o backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Gerar lockfile reproduzível
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testar o frontend
        run: npm run test:run

      - name: Gerar build de produção
        run: npm run build

      - name: Publicar lockfile para inclusão no repositório
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error

  dataset:
    name: Dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Testar o gerador
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Gerar amostra determinística
        run: >-
          python tools/generate_dataset.py
          --rows 10000
          --output "${{ runner.temp }}/transactions-10000.csv"

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend, dataset]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Validar a configuração do Compose
        run: docker compose config --quiet

      - name: Gerar dataset pequeno para o smoke test
        run: >-
          python tools/generate_dataset.py
          --rows 250
          --output "${{ runner.temp }}/transactions-smoke.csv"

      - name: Subir a solução completa
        run: docker compose up --build --wait --wait-timeout 240

      - name: Validar UI, proxy e ingestão assíncrona
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error http://localhost:8080/ >/dev/null
          curl --fail --silent --show-error http://localhost:8080/api/actuator/health >/dev/null

          upload_response="$(curl --fail --silent --show-error \
            -F "file=@${RUNNER_TEMP}/transactions-smoke.csv;type=text/csv" \
            http://localhost:8080/api/imports)"
          job_id="$(python -c 'import json, sys; print(json.load(sys.stdin)["jobId"])' <<< "${upload_response}")"

          terminal=false
          status=""
          for _ in {1..60}; do
            status_response="$(curl --fail --silent --show-error "http://localhost:8080/api/imports/${job_id}")"
            terminal="$(python -c 'import json, sys; print(str(json.load(sys.stdin)["terminal"]).lower())' <<< "${status_response}")"
            status="$(python -c 'import json, sys; print(json.load(sys.stdin)["status"])' <<< "${status_response}")"
            if [[ "${terminal}" == "true" ]]; then
              break
            fi
            sleep 1
          done

          [[ "${terminal}" == "true" ]]
          [[ "${status}" == "COMPLETED" ]]

          curl --fail --silent --show-error "http://localhost:8080/api/imports/${job_id}/analytics" >/dev/null
          curl --fail --silent --show-error "http://localhost:8080/api/imports/${job_id}/transactions?limit=10" >/dev/null

      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a solução
        if: always()
        run: docker compose down --volumes --remove-orphans
