name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar a JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar e testar o backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testar o frontend
        run: npm run test:run

      - name: Gerar build de produção
        run: npm run build

  dataset:
    name: Dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Testar o gerador
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Gerar amostra determinística
        run: >-
          python tools/generate_dataset.py
          --rows 10000
          --output "${{ runner.temp }}/transactions-10000.csv"
