spring:
  rabbitmq:
    addresses: localhost:5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: 128MB
      max-request-size: 129MB

app:
  storage:
    temporary-directory: ${java.io.tmpdir}/geosapiens-test-uploads
  messaging:
    ingestion-exchange: ingestion.jobs
    ingestion-queue: ingestion.jobs.process
    ingestion-routing-key: ingestion.process
  outbox:
    enabled: false
    poll-interval: 1s
    batch-size: 10
    claim-duration: 51s
    confirm-timeout: 5s
    max-attempts: 3
    initial-retry-delay: 1s
    max-retry-delay: 10s
