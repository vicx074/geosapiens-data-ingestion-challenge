spring:
  application:
    name: geosapiens-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${MAX_UPLOAD_SIZE}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  task:
    scheduling:
      pool:
        size: 1

app:
  storage:
    temporary-directory: ${TEMPORARY_STORAGE_DIRECTORY}
  csv:
    max-record-characters: ${CSV_MAX_RECORD_CHARACTERS:4096}
  messaging:
    ingestion-exchange: ${RABBITMQ_INGESTION_EXCHANGE}
    ingestion-queue: ${RABBITMQ_INGESTION_QUEUE}
    ingestion-routing-key: ${RABBITMQ_INGESTION_ROUTING_KEY}
    ingestion-dead-letter-exchange: ${RABBITMQ_INGESTION_DLX:ingestion.jobs.dlx}
    ingestion-dead-letter-queue: ${RABBITMQ_INGESTION_DLQ:ingestion.jobs.dead}
    ingestion-dead-letter-routing-key: ${RABBITMQ_INGESTION_DEAD_LETTER_ROUTING_KEY:ingestion.dead}
  worker:
    enabled: ${WORKER_ENABLED:false}
    concurrency: ${WORKER_CONCURRENCY:2}
    prefetch: ${WORKER_PREFETCH:1}
    batch-size: ${WORKER_BATCH_SIZE:1000}
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED}
    poll-interval: ${OUTBOX_POLL_INTERVAL}
    batch-size: ${OUTBOX_BATCH_SIZE}
    claim-duration: ${OUTBOX_CLAIM_DURATION}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS}
    initial-retry-delay: ${OUTBOX_INITIAL_RETRY_DELAY}
    max-retry-delay: ${OUTBOX_MAX_RETRY_DELAY}
